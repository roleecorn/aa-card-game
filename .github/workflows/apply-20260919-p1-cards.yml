name: Apply 2026-09-19 P1 card pool

on:
  push:
    branches:
      - feature/20260919-discussion-update-p1

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/20260919-discussion-update-p1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply P1 card pool patch
        run: python scripts/apply-20260919-p1-cards.py

      - name: Align superseded card-rule tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected legacy test snippet not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/tests/skill-runtime-regressions.test.ts',
              "    expect(engine.getCharacter('player', 'meteor')?.stress).toBe(1);\n    expect(engine.getCharacter('player', 'enki')?.stress).toBe(0);\n    expect(engine.getCharacter('player', SKILL_FIXTURES.playerA)?.stress).toBe(0);",
              "    expect(engine.getCharacter('player', 'meteor')?.stress).toBe(1);\n    expect(engine.getCharacter('player', 'enki')?.stress).toBe(0);\n    expect(engine.getCharacter('player', SKILL_FIXTURES.playerA)?.stress).toBe(-1);",
          )

          replace(
              'src/tests/targeting.test.ts',
              "    expect(getCardAvailability(engine, 'player', soothe).allowed).toBe(false);\n    engine.getCharacter('player', 'grimm')!.stress = 1;\n    expect(getCardAvailability(engine, 'player', soothe).allowed).toBe(true);",
              "    expect(getCardAvailability(engine, 'player', soothe).allowed).toBe(true);",
          )

          replace(
              'src/tests/action-feedback.test.ts',
              "  it('preserves the card caster for delayed writer block and marks the debuff', () => {",
              "  it('records the immediate round-scoped writer-block debuff at its target', () => {",
          )
          replace(
              'src/tests/action-feedback.test.ts',
              "    expect(event.impacts).toContainEqual(expect.objectContaining({ anchor: 'member:pintbox', tone: 'negative' }));\n\n    state.phase = 'player-assign';\n    engine.finishPlayerAssignment();\n\n    const delayed = state.feedback!.find((item) => item.name === '卡文（延遲觸發）')!;\n    expect(delayed).toMatchObject({ actorId: 'mashiro', teamId: 'player', kind: 'card' });\n    expect(delayed.impacts).toContainEqual(expect.objectContaining({ anchor: 'member:pintbox', part: '壓力', tone: 'negative' }));",
              "    expect(event).toMatchObject({ actorId: 'mashiro', teamId: 'player', kind: 'card' });\n    expect(event.impacts).toContainEqual(expect.objectContaining({\n      anchor: 'member:pintbox',\n      part: '卡文 · 特殊狀態',\n      tone: 'neutral',\n    }));\n\n    state.phase = 'player-assign';\n    engine.finishPlayerAssignment();\n    expect(state.feedback!.some((item) => item.name === '卡文（延遲觸發）')).toBe(false);",
          )
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Remove temporary applicator
        run: |
          rm scripts/apply-20260919-p1-cards.py
          rm .github/workflows/apply-20260919-p1-cards.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement discussion P1 card pool"
          git push origin HEAD:feature/20260919-discussion-update-p1
