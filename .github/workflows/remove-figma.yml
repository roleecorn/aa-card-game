name: Remove obsolete Figma workflow

on:
  push:
    branches:
      - feature/20260919-discussion-update-p3

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/20260919-discussion-update-p3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check fonttools brotli

      - name: Remove Figma content
        run: python scripts/remove-figma.py

      - name: Assert no tracked Figma references remain
        run: |
          if git grep -in 'figma' -- ':!scripts/remove-figma.py' ':!.github/workflows/remove-figma.yml'; then
            echo 'Unexpected Figma references remain.' >&2
            exit 1
          fi

      - name: Generate current UI font subset
        run: bash scripts/vendor-ui-font.sh

      - name: Tutorial regression
        run: npm run test:tutorial

      - name: Verify repository
        run: npm run verify

      - name: Commit validated cleanup
        run: |
          git restore --worktree -- public/fonts/noto-sans-tc-ui.woff2 public/assets/characters/compact || true
          rm scripts/remove-figma.py
          rm .github/workflows/remove-figma.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove obsolete Figma workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
