name: Apply runtime asset conventions

on:
  push:
    branches:
      - feature/20260919-discussion-update-p3

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/20260919-discussion-update-p3
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply asset convention cleanup
        run: |
          python scripts/apply-runtime-asset-conventions.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/runtime-assets.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "      expect(source, `${file} must not depend on external URLs`).not.toMatch(/https?:\\/\\//i);"
          new = "      const withoutStandardNamespace = source.replace('http://www.w3.org/2000/svg', '');\n      expect(withoutStandardNamespace, `${file} must not depend on external URLs`).not.toMatch(/https?:\\/\\//i);"
          if text.count(old) != 1:
              raise SystemExit('runtime-assets external URL assertion anchor mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Focused asset contracts
        run: npm run test:assets
      - name: Audit checked-in character binary dimensions
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import sharp from 'sharp';

          const families = [
            ['portrait', 'public/assets/characters/portrait', 768, 1024],
            ['compact', 'public/assets/characters/compact', 384, 320],
          ];
          let totalMismatch = 0;
          for (const [family, dir, expectedWidth, expectedHeight] of families) {
            const names = (await fs.readdir(dir)).filter((name) => name.endsWith('.webp')).sort();
            const mismatches = [];
            for (const name of names) {
              const metadata = await sharp(path.join(dir, name)).metadata();
              if (metadata.width !== expectedWidth || metadata.height !== expectedHeight) {
                mismatches.push(`${name}=${metadata.width}x${metadata.height}`);
              }
            }
            totalMismatch += mismatches.length;
            console.log(`${family}: ${names.length - mismatches.length}/${names.length} checked-in files already canonical`);
            if (mismatches.length) console.log(`${family} pre-normalize mismatches: ${mismatches.join(', ')}`);
          }
          console.log(`checked-in character dimension mismatches: ${totalMismatch}`);
          JS
      - name: Normalize character art for runtime validation
        run: npm run art:normalize
      - name: Character binary validation
        run: npm run art:validate
      - name: Tutorial regression
        run: npm run test:tutorial
      - name: Full tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Restore generated character binaries
        run: |
          while IFS= read -r file; do
            git checkout HEAD -- "$file"
          done < <(git ls-files 'public/assets/characters/portrait/*.webp' 'public/assets/characters/compact/*.webp')
      - name: Remove temporary audit/applicator files
        run: |
          rm scripts/apply-runtime-asset-conventions.py
          rm .github/workflows/apply-runtime-asset-conventions.yml
          rm .github/workflows/audit-runtime-assets.yml
      - name: Commit validated asset conventions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unify runtime asset conventions"
          git push origin HEAD:feature/20260919-discussion-update-p3
