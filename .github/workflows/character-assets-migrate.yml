name: Migrate Character Assets

on:
  push:
    branches:
      - fix/character-assets-ux
    paths:
      - 'scripts/migrate-character-assets.ts'
      - '.github/workflows/character-assets-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-assets-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npx tsx scripts/migrate-character-assets.ts

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/portrait public/assets/characters/compact
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets: split portrait and compact character art"
          git push origin HEAD:fix/character-assets-ux
