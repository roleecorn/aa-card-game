name: Apply 2026-09-19 P0 discussion update

on:
  push:
    branches:
      - feature/20260919-discussion-update-p0

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/20260919-discussion-update-p0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix audit false positive
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-20260919-p0.mjs')
          text = path.read_text(encoding='utf-8')
          old = "if (line.includes(\"'色'\") && (line.includes('affinities') || line.includes('workType') || line.includes('types:'))) {"
          new = "if (rel !== 'src/tests/discussion-p0-rules.test.ts' && line.includes(\"'色'\") && (line.includes('affinities') || line.includes('workType') || line.includes('types:'))) {"
          if old not in text:
              raise SystemExit('audit predicate not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply P0 changes
        run: node scripts/apply-20260919-p0.mjs

      - name: Adapt existing callers
        run: python scripts/apply-20260919-p0-compat.py

      - name: Initialize optional roll constraints in effect handler
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/effectRegistry.ts')
          text = path.read_text(encoding='utf-8')
          old = '      member.timedRollConstraints.push({'
          new = '      (member.timedRollConstraints ??= []).push({'
          if old not in text:
              raise SystemExit('roll constraint push not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Align legacy tests with P0 rule changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(file, old, new, count=1):
              path = Path(file)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected test snippet not found in {file}: {old[:100]}')
              path.write_text(text.replace(old, new, count), encoding='utf-8')

          rep(
              'src/tests/character-calibration.test.ts',
              "  it('副組長力 only transfers coordination stress when the vice leader is below the leader', () => {",
              "  it('副組長力 transfers coordination stress only when the vice leader has more remaining headroom', () => {",
          )
          rep('src/tests/character-calibration.test.ts', '    leader.stress = 2;\n    viceLeader.stress = 1;', '    leader.stress = 5;\n    viceLeader.stress = 1;')
          rep('src/tests/character-calibration.test.ts', "    viceLeader.stress = 2;\n    expect(engine.skills.getCoordinationStressBearer('player')).toBeUndefined();", "    viceLeader.stress = 2;\n    expect(engine.skills.getCoordinationStressBearer('player')).toBe('pintbox');")
          rep('src/tests/character-calibration.test.ts', "    viceLeader.stress = 3;\n    expect(engine.skills.getCoordinationStressBearer('player')).toBeUndefined();", "    viceLeader.stress = 3;\n    expect(engine.skills.getCoordinationStressBearer('player')).toBe('pintbox');")

          rep(
              'src/tests/skills.test.ts',
              "  it('副組長力 makes 流星 take coordination-card stress when below the leader', () => {",
              "  it('副組長力 makes 流星 take coordination-card stress when it has more headroom than the leader', () => {",
          )
          rep('src/tests/skills.test.ts', "    engine.getCharacter('player', 'pintbox')!.stress = 2;", "    engine.getCharacter('player', 'pintbox')!.stress = 4;", 1)
          rep('src/tests/skills.test.ts', "    expect(engine.getCharacter('player', 'pintbox')?.stress).toBe(2);", "    expect(engine.getCharacter('player', 'pintbox')?.stress).toBe(4);", 1)

          rep('src/tests/leader-succession.test.ts', '    leader.stress = 2;\n    viceLeader.stress = 0;', '    leader.stress = 4;\n    viceLeader.stress = 0;')
          rep('src/tests/leader-succession.test.ts', '    expect(leader.stress).toBe(1);', '    expect(leader.stress).toBe(3);', 1)

          rep(
              'src/tests/skill-runtime-regressions.test.ts',
              "    expect(leader.stress).toBe(1);\n    expect(engine.playCard('player', cards[1]!.instanceId, { memberId: 'emotion', skill: 'text' })).toBe(true);\n    expect(leader.stress).toBe(2);",
              "    expect(leader.stress).toBe(0);\n    expect(engine.playCard('player', cards[1]!.instanceId, { memberId: 'emotion', skill: 'text' })).toBe(true);\n    expect(leader.stress).toBe(0);",
          )

          old_enki = """  it('Enki 副組長力 is resolved before coordination Stress and never reacts to the opponent card event', () => {
            const { game, engine } = createSkillHarness({ player: [SKILL_FIXTURES.playerA, 'enki'] });
            const leader = engine.getCharacter('player', SKILL_FIXTURES.playerA)!;
            const enki = engine.getCharacter('player', 'enki')!;
            leader.stress = 2;
            enki.stress = 2;
            engine.addCard('player', 'guide', 1);
            const playerCard = game.player.hand.find((card) => card.cardId === 'guide')!;

            expect(engine.playCard('player', playerCard.instanceId, { memberId: SKILL_FIXTURES.playerB, skill: 'design' })).toBe(true);
            expect(leader.stress).toBe(2);
            expect(enki.stress).toBe(3);

            engine.addCard('enemy', 'guide', 1);
            const enemyCard = game.enemy.hand.find((card) => card.cardId === 'guide')!;
            expect(engine.playCard('enemy', enemyCard.instanceId, { memberId: SKILL_FIXTURES.enemyB, skill: 'design' })).toBe(true);
            expect(leader.stress).toBe(2);
            expect(enki.stress).toBe(3);
          });""".replace('          ', '')
          new_enki = """  it('Enki 副組長力 uses headroom for normal coordination cost but does not intercept 指導 target Stress', () => {
            const { game, engine } = createSkillHarness({ player: [SKILL_FIXTURES.playerA, 'enki'] });
            const leader = engine.getCharacter('player', SKILL_FIXTURES.playerA)!;
            const enki = engine.getCharacter('player', 'enki')!;
            const target = engine.getCharacter('player', SKILL_FIXTURES.playerB)!;
            leader.stress = 4;
            enki.stress = 2;

            engine.addCard('player', 'guide', 1);
            const guide = game.player.hand.find((card) => card.cardId === 'guide')!;
            expect(engine.playCard('player', guide.instanceId, { memberId: SKILL_FIXTURES.playerB, skill: 'design' })).toBe(true);
            expect(leader.stress).toBe(4);
            expect(enki.stress).toBe(2);
            expect(target.stress).toBe(1);

            engine.addCard('player', 'soothe', 1);
            const soothe = game.player.hand.find((card) => card.cardId === 'soothe')!;
            expect(engine.playCard('player', soothe.instanceId, { memberId: SKILL_FIXTURES.playerB })).toBe(true);
            expect(leader.stress).toBe(4);
            expect(enki.stress).toBe(3);

            engine.addCard('enemy', 'guide', 1);
            const enemyCard = game.enemy.hand.find((card) => card.cardId === 'guide')!;
            expect(engine.playCard('enemy', enemyCard.instanceId, { memberId: SKILL_FIXTURES.enemyB, skill: 'design' })).toBe(true);
            expect(leader.stress).toBe(4);
            expect(enki.stress).toBe(3);
          });""".replace('          ', '')
          rep('src/tests/skill-runtime-regressions.test.ts', old_enki, new_enki)

          rep("src/tests/skill-runtime-regressions.test.ts", "    engine.addCard('player', 'guide', 1);\n    const card = game.player.hand.find((item) => item.cardId === 'guide')!;", "    engine.addCard('player', 'soothe', 1);\n    const card = game.player.hand.find((item) => item.cardId === 'soothe')!;")
          rep("src/tests/skill-runtime-regressions.test.ts", "    expect(engine.playCard('player', card.instanceId, { memberId: SKILL_FIXTURES.playerA, skill: 'design' })).toBe(true);", "    expect(engine.playCard('player', card.instanceId, { memberId: SKILL_FIXTURES.playerA })).toBe(true);")
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Remove temporary applicators
        run: |
          rm scripts/apply-20260919-p0.mjs
          rm scripts/apply-20260919-p0-compat.py
          rm .github/workflows/apply-20260919-p0.yml

      - name: Commit validated P0 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: implement 2026-09-19 P0 rules foundation"
          git push origin HEAD:feature/20260919-discussion-update-p0
