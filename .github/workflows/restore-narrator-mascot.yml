name: Restore Original Character Art
on:
  push:
    branches:
      - fix/restore-narrator-mascot
    paths:
      - 'scripts/restore-narrator-mascot.ts'
      - '.github/workflows/restore-narrator-mascot.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-narrator-mascot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Restore original sources from repository history
        run: |
          git show 043756e1cdcb038e0e7e2da9ecf56bcda54cb935:public/assets/characters/narrator.webp > /tmp/narrator-original.webp
          git show 043756e1cdcb038e0e7e2da9ecf56bcda54cb935:public/assets/characters/ginsakura.webp > /tmp/ginsakura-original.webp
      - run: npx tsx scripts/restore-narrator-mascot.ts
      - run: npm run art:validate
      - name: Commit restored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/portrait/narrator.webp public/assets/characters/compact/narrator.webp
          git add public/assets/characters/portrait/ginsakura.webp public/assets/characters/compact/ginsakura.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore original narrator and ginsakura art"
          git push origin HEAD:fix/restore-narrator-mascot
