name: Audit runtime assets

on:
  push:
    branches:
      - feature/20260919-discussion-update-p3

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inventory runtime and reference assets
        run: |
          echo '--- public files ---'
          find public -type f | sort
          echo '--- src/assets files ---'
          find src/assets -type f | sort || true
          echo '--- docs/art files ---'
          find docs/art -type f | sort || true
      - name: Inspect unmanaged raster metadata
        run: |
          npx tsx scripts/image-tools.ts inspect \
            public/assets/cards/coordination.png \
            public/assets/cards/event.png \
            public/assets/work-slot-complete-stamp.png
      - name: Find raster runtime references
        run: |
          echo '--- coordination/event references ---'
          rg -n 'coordination\.png|event\.png' src public README.md ARCHITECTURE.md CONTRIBUTING.md AGENTS.md || true
          echo '--- work-slot stamp references ---'
          rg -n 'work-slot-complete-stamp' src public README.md ARCHITECTURE.md CONTRIBUTING.md AGENTS.md || true
          echo '--- root-absolute asset paths in source/docs ---'
          rg -n "['\"]\/assets\/" src README.md ARCHITECTURE.md CONTRIBUTING.md AGENTS.md CHARACTER_CARD_ART.md CARD_ART_STYLE.md || true
