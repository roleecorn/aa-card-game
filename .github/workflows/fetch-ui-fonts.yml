name: Fetch UI Fonts

on:
  pull_request:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Fontsource URLs
        run: |
          mkdir -p fonts
          curl -fL "https://cdn.jsdelivr.net/fontsource/css/noto-sans-tc:vf@5.3.0/index.css" -o fonts/fontsource.css
          cat fonts/fontsource.css
      - uses: actions/upload-artifact@v4
        with:
          name: noto-sans-tc-vendored
          path: fonts/
          if-no-files-found: error
