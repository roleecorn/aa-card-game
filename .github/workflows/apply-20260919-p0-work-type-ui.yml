name: Apply 2026-09-19 P0 work-type UI

on:
  push:
    branches:
      - feature/20260919-discussion-update-p0

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/20260919-discussion-update-p0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply P0 work-type setup patch
        run: python scripts/apply-20260919-p0-work-type-ui.py

      - name: Align legacy setup source assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected legacy assertion not found in {path}: {old}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/tests/online-draft-ui.test.ts',
              "    expect(appSource).toContain('if (onlineDraft && !onlineDraftSettled)');",
              "    expect(appSource).toContain(\"onlineDraft.status === 'complete' && onlineDraftSettled ? 'online-work-types' : 'online-draft'\");",
          )
          replace(
              'src/tests/team-size-mode.test.ts',
              "    expect(appSource).toContain('startGame(draftRoster.player, draftRoster.enemy, leaderId, draftRoster.gameDefinition)');",
              "    expect(appSource).toContain(\"setAppStage('work-types')\");\n    expect(appSource).toContain('draftRoster.gameDefinition,');\n    expect(appSource).toContain('selections,');",
          )
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Remove temporary applicator
        run: |
          rm scripts/apply-20260919-p0-work-type-ui.py
          rm .github/workflows/apply-20260919-p0-work-type-ui.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add initial work-type selection flow"
          git push origin HEAD:feature/20260919-discussion-update-p0
