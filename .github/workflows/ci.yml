name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
      - release

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release promotion source
        if: github.event_name == 'pull_request' && github.base_ref == 'release'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" != "main" || "$HEAD_REPO" != "$REPOSITORY" ]]; then
            echo "Release pull requests must promote this repository's main branch into release."
            echo "Expected: ${REPOSITORY}:main -> ${REPOSITORY}:release"
            echo "Actual:   ${HEAD_REPO}:${HEAD_REF} -> ${REPOSITORY}:release"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check fonttools brotli

      - name: Verify vendored UI font
        run: |
          bash scripts/vendor-ui-font.sh
          if ! git diff --exit-code -- public/fonts/; then
            echo "Vendored UI font is stale. Regenerate with: bash scripts/vendor-ui-font.sh"
            exit 1
          fi

      - name: Tutorial regression
        run: npm run test:tutorial

      - name: Verify assets, tests, and build
        run: npm run verify
