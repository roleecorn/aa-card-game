name: Compare Historical Character Art
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-narrator-mascot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Extract historical character art
        run: |
          for id in pintbox mashiro user79 narrator ginsakura bluewind; do
            git show 2c311ef8e0a4a26057b7ddda98af62770feddc26:public/assets/characters/$id.webp > /tmp/$id-initial.webp
            git show 043756e1cdcb038e0e7e2da9ecf56bcda54cb935:public/assets/characters/$id.webp > /tmp/$id-replaced.webp
          done
      - run: npx tsx scripts/compare-character-history.ts
      - uses: actions/upload-artifact@v4
        with:
          name: character-history-comparison
          path: /tmp/character-history-comparison.png
