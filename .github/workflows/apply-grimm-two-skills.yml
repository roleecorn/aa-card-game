name: Apply Grimm two-skill restoration

on:
  push:
    branches:
      - feature/20260919-discussion-update-p3

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check fonttools brotli

      - name: Apply Grimm restoration
        run: python scripts/apply-grimm-two-skills.py

      - name: Generate current UI font subset
        run: bash scripts/vendor-ui-font.sh

      - name: Tutorial regression
        run: npm run test:tutorial

      - name: Verify repository
        run: npm run verify

      - name: Commit validated changes
        run: |
          git restore --worktree -- public/fonts/noto-sans-tc-ui.woff2 public/assets/characters/compact || true
          rm scripts/apply-grimm-two-skills.py
          rm .github/workflows/apply-grimm-two-skills.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/content/grimm.ts \
            src/app/BattleRoom.tsx \
            src/components/SkillActivationDialog.tsx \
            src/tests/grimm-character.test.ts \
            src/tests/targeting.test.ts \
            src/tests/skill-targeting-contracts.test.ts \
            src/tests/action-feedback.test.ts \
            docs/characters/pintbox-20260913-balance.md \
            GAME_RULES.md \
            GAME_MANUAL.md
          git add -u scripts/apply-grimm-two-skills.py .github/workflows/apply-grimm-two-skills.yml
          git diff --cached --check
          git commit -m "fix: restore Grimm burning frame skill"
          git push origin HEAD:${GITHUB_REF_NAME}
