name: Fix Compact Character Scale
on:
  push:
    branches:
      - fix/compact-character-scale
    paths:
      - 'scripts/fix-compact-character-scale.ts'
      - '.github/workflows/fix-compact-character-scale.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-character-scale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsx scripts/fix-compact-character-scale.ts
      - name: Commit corrected compact art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/compact
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets: normalize compact character framing"
          git push origin HEAD:fix/compact-character-scale
