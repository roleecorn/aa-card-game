name: Apply 2026-09-19 P2C Narrator Ginsakura

on:
  push:
    branches:
      - feature/20260919-discussion-update-p2

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/20260919-discussion-update-p2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply P2C patch
        run: python scripts/apply-20260919-p2c-narrator-ginsakura.py

      - name: Align P2C tests
        run: |
          sed -i "s/engine\.canActivateSkillTarget(/engine.skills.canActivateSkillTarget(/g" src/tests/discussion-p2c-narrator-ginsakura.test.ts
          python - <<'PY'
          from pathlib import Path

          p = Path('src/tests/skill-contracts.test.ts')
          text = p.read_text(encoding='utf-8')
          old = "    expect(plannedPlayableCharacters).toEqual(['ginsakura', 'narrator']);"
          new = "    expect(plannedPlayableCharacters).toEqual([]);"
          if old not in text:
              raise SystemExit('old planned-character assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('src/tests/skills.test.ts')
          text = p.read_text(encoding='utf-8')
          old = "    expect(SKILLS.ginsakuraSupport?.description).toContain('目前整理紀錄沒有完整');"
          new = "    expect(SKILLS.ginsakuraSupport?.status).toBe('implemented');\n    expect(SKILLS.narratorLongForm?.status).toBe('implemented');\n    expect(SKILLS.narratorOsaka?.status).toBe('implemented');"
          if old not in text:
              raise SystemExit('old unsupported Ginsakura assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Remove temporary applicator
        run: |
          rm scripts/apply-20260919-p2c-narrator-ginsakura.py
          rm .github/workflows/apply-20260919-p2c-narrator-ginsakura.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: update Narrator and Ginsakura"
          git push origin HEAD:feature/20260919-discussion-update-p2
