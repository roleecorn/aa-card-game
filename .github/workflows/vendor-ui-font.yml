name: Vendor UI Font

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check fonttools brotli

      - name: Build vendored UI font
        run: bash scripts/vendor-ui-font.sh

      - name: Upload generated font files
        uses: actions/upload-artifact@v4
        with:
          name: vendored-ui-font-${{ github.sha }}
          path: public/fonts/
          if-no-files-found: error
