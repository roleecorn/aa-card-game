name: Vendor UI Font

on:
  workflow_dispatch:
  push:
    branches:
      - feat/gameplay-action-feedback

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gameplay-action-feedback

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check fonttools brotli

      - name: Build vendored UI font
        run: bash scripts/vendor-ui-font.sh

      - name: Commit regenerated font when changed
        run: |
          if git diff --quiet -- public/fonts/; then
            echo "Vendored font is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts/
          git commit -m "assets: vendor Noto Sans TC UI subset"
          git push origin HEAD:feat/gameplay-action-feedback
